[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-forecast"
version = "0.1.0"
description = "Practical time series forecasting toolkit with ARIMA, Prophet, LSTM, and feature engineering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "prophet>=1.1",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
